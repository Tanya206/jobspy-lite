services:
  jobspy-lite:
    build: .
    container_name: jobspy-lite
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data   # SQLite DB, Excel export, resume survive restarts
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
