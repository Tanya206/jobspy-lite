name: Terraform AWS

# Plans on every PR/push touching infra/aws. Apply is manual so a local
# terraform apply is not doubled by an empty CI state.
# Requires repo secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   TF_VAR_AWS_SSH_PUBLIC_KEY   OpenSSH public key authorized on the instance
# Optional:
#   AWS_REGION   default us-east-1
# TF_VAR_ssh_public_key is the only required Terraform variable in CI.
# Other vars use the defaults in infra/aws/variables.tf.

on:
  push:
    branches: [master]
    paths:
      - "infra/aws/**"
      - "deploy/cloud-init-aws.yaml"
      - ".github/workflows/terraform-aws.yml"
  pull_request:
    paths:
      - "infra/aws/**"
      - "deploy/cloud-init-aws.yaml"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_WORKDIR: infra/aws
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_AWS_SSH_PUBLIC_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore terraform state
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TF_WORKDIR }}/.terraform
            ${{ env.TF_WORKDIR }}/terraform.tfstate
          key: tfstate-aws-restore-plan-${{ github.run_id }}
          restore-keys: |
            tfstate-aws-${{ github.ref_name }}-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Init
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -input=false

      - name: Validate
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform validate

      - name: Plan
        id: plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform plan -input=false -no-color -out=tfplan > plan.txt
          echo "changed=$(grep -cE 'Plan: [1-9][0-9]* (to add|to change)' plan.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.TF_WORKDIR + '/plan.txt', 'utf8');
            const body = `#### Terraform AWS plan\n\`\`\`\n${plan.slice(0, 30000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4

      - name: Restore terraform state
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TF_WORKDIR }}/.terraform
            ${{ env.TF_WORKDIR }}/terraform.tfstate
          key: tfstate-aws-restore-apply-${{ github.run_id }}
          restore-keys: |
            tfstate-aws-${{ github.ref_name }}-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Init
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -input=false

      - name: Apply
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve

      - name: Save terraform state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TF_WORKDIR }}/.terraform
            ${{ env.TF_WORKDIR }}/terraform.tfstate
          key: tfstate-aws-${{ github.ref_name }}-${{ github.run_id }}

      - name: Print outputs
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform output public_ip
          terraform output dashboard_url
          terraform output secret_name
