name: Deploy AWS

# Rebuilds the Docker image on the AWS instance and restarts the stack —
# same path as deploy/deploy-aws.sh, triggered by a push to master (or by hand).
# Requires repo secrets:
#   AWS_HOST      Elastic IP from terraform output public_ip
#   AWS_SSH_USER  ubuntu
#   AWS_SSH_KEY   private key matching TF_VAR_AWS_SSH_PUBLIC_KEY
# App keys stay in Secrets Manager. This job never ships a .env; the
# instance role rewrites ~/app/.env on each deploy.

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "frontend/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - "run.py"
      - "deploy/fetch-aws-env.sh"
      - "deploy/render_aws_secret.py"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_HOST_RAW: ${{ secrets.AWS_HOST }}
      AWS_USER_RAW: ${{ secrets.AWS_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        run: |
          echo "AWS_HOST=$(printf '%s' "$AWS_HOST_RAW" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          user="$(printf '%s' "$AWS_USER_RAW" | tr -d '[:space:]')"
          echo "AWS_USER=${user:-ubuntu}" >> "$GITHUB_ENV"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/aws_key
          chmod 600 ~/.ssh/aws_key
          if ! ssh-keygen -y -f ~/.ssh/aws_key >/dev/null 2>&1; then
            echo "::error::AWS_SSH_KEY is not a valid private key — it must be the full PEM or OpenSSH private key including the BEGIN/END lines (CRLF endings are fine, they get stripped)."
            exit 1
          fi
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync repo to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/aws_key -o IdentitiesOnly=yes" \
            --exclude .git --exclude .venv --exclude node_modules \
            --exclude frontend/dist --exclude data --exclude .env \
            --exclude secret.json --exclude __pycache__ --exclude .pytest_cache \
            --exclude .terraform --exclude terraform.tfstate \
            --exclude terraform.tfstate.backup --exclude terraform.tfvars \
            ./ "$AWS_USER@$AWS_HOST":~/app/

      - name: Refresh .env from Secrets Manager
        run: |
          ssh -i ~/.ssh/aws_key -o IdentitiesOnly=yes \
            "$AWS_USER@$AWS_HOST" \
            'bash ~/app/deploy/fetch-aws-env.sh ~/app/.env'

      - name: Build + restart (detached), then poll health
        run: |
          SSH="ssh -i ~/.ssh/aws_key -o IdentitiesOnly=yes"
          $SSH "$AWS_USER@$AWS_HOST" \
            'cd ~/app && nohup docker compose up --build -d > build.log 2>&1 & exit 0'
          for i in $(seq 1 40); do
            if $SSH "$AWS_USER@$AWS_HOST" 'test -f ~/app/build.log' 2>/dev/null; then
              break
            fi
            sleep 10
          done
          for i in $(seq 1 40); do
            sleep 15
            if $SSH "$AWS_USER@$AWS_HOST" 'curl -sf -m 5 http://127.0.0.1:8000/health' >/dev/null; then
              echo "Healthy after ~$((i*15))s"
              $SSH "$AWS_USER@$AWS_HOST" 'curl -s http://127.0.0.1:8000/health'
              exit 0
            fi
          done
          echo "::error::Health check failed after 10 minutes"
          $SSH "$AWS_USER@$AWS_HOST" 'tail -40 ~/app/build.log'
          exit 1
