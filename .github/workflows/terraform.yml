name: Terraform infra

# Plans on every PR touching the OCI files in infra/, applies by hand.
# infra/aws is a separate stack and is not applied by this workflow.
# Requires repo secrets (same OCI API key as the CLI, values from
# Profile → User settings → API keys):
#   TF_VAR_tenancy_ocid, TF_VAR_user_ocid, TF_VAR_fingerprint,
#   TF_VAR_private_key (PEM body), TF_VAR_region,
#   TF_VAR_ssh_public_key
# TF_VAR_* environment variables feed Terraform directly — no tfvars file
# needed in CI.

on:
  push:
    branches: [master]
    paths:
      - "infra/*.tf"
      - "infra/*.md"
      - "infra/*.example"
      - "deploy/cloud-init.yaml"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/*.tf"
      - "infra/*.md"
      - "infra/*.example"
      - "deploy/cloud-init.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # comment the plan on PRs

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_WORKDIR: infra
  # Secrets were stored with UPPERCASE names; map them explicitly to the
  # exact TF_VAR_* casing Terraform requires. Safe to keep if you later
  # re-add lowercase-named secrets (mapping then just points at itself).
  TF_VAR_tenancy_ocid: ${{ secrets.TF_VAR_TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.TF_VAR_USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.TF_VAR_FINGERPRINT }}
  TF_VAR_private_key: ${{ secrets.TF_VAR_PRIVATE_KEY }}
  TF_VAR_region: ${{ secrets.TF_VAR_REGION }}
  TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
  TF_VAR_image_ocid: ${{ secrets.TF_VAR_IMAGE_OCID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore terraform state
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TF_WORKDIR }}/.terraform
            ${{ env.TF_WORKDIR }}/terraform.tfstate
          key: tfstate-restore-plan-${{ github.run_id }}
          restore-keys: |
            tfstate-${{ github.ref_name }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Init
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -input=false

      - name: Validate
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform validate

      - name: Plan
        id: plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform plan -input=false -no-color -out=tfplan > plan.txt
          echo "changed=$(grep -cE 'Plan: [1-9][0-9]* (to add|to change)' plan.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.TF_WORKDIR + '/plan.txt', 'utf8');
            const body = `#### Terraform plan\n\`\`\`\n${plan.slice(0, 30000)}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    needs: plan
    # Manual-only for now: the live instance at OCI_HOST was created by hand
    # and is NOT in terraform state — an automatic apply would build a second
    # instance. Switch this to the master-push gate (or add import blocks to
    # adopt the existing instance) when you're ready for TF to own infra.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production   # gate with a required reviewer if you want
    steps:
      - uses: actions/checkout@v4

      - name: Restore terraform state
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.TF_WORKDIR }}/.terraform
            ${{ env.TF_WORKDIR }}/terraform.tfstate
          key: tfstate-restore-apply-${{ github.run_id }}
          restore-keys: |
            tfstate-${{ github.ref_name }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Init
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -input=false

      - name: Apply
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform apply -input=false -auto-approve

      # ALWAYS persist state, even when apply fails mid-way — otherwise the
      # next run re-creates resources that already exist (hit the vcn-count
      # limit that way).
      - name: Save terraform state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.TF_WORKDIR }}/.terraform
            ${{ env.TF_WORKDIR }}/terraform.tfstate
          key: tfstate-${{ github.ref_name }}-${{ github.run_id }}

      - name: Print public IP
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform output public_ip
