#cloud-config
# AWS first-boot setup for JobSpy Lite.
# Terraform renders this file. aws_region and secret_id are substituted.
# Any other shell brace variable in runcmd is escaped for templatefile.
#
# What it does:
#   1. Installs Docker Engine + the compose plugin, plus the AWS CLI
#   2. Lets the ubuntu user run docker without sudo
#   3. Creates ~/app and records the Secrets Manager id in /etc/jobspy/aws.env
#   4. Adds a 2GB swapfile so t3.micro (1GB RAM) survives the image build
#
# First boot takes a few minutes. Check with: ssh ubuntu@IP "cloud-init status"

bootcmd:
  - mkdir -p /etc/jobspy

package_update: true
packages:
  - ca-certificates
  - curl
  - python3
  - awscli

write_files:
  - path: /etc/sysctl.d/99-jobspy.conf
    content: |
      vm.swappiness=10
  - path: /etc/jobspy/aws.env
    permissions: "0644"
    content: |
      AWS_REGION="${aws_region}"
      SECRET_ID="${secret_id}"

runcmd:
  - |
    set -eux
    export DEBIAN_FRONTEND=noninteractive
    apt-get install -y docker.io
    apt-get install -y docker-compose-v2 || apt-get install -y docker-compose || true
    if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
      arch="$(uname -m)"
      mkdir -p /usr/local/lib/docker/cli-plugins
      curl -fsSL "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-$${arch}" \
        -o /usr/local/lib/docker/cli-plugins/docker-compose
      chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
    fi
    systemctl enable --now docker
    usermod -aG docker ubuntu
    install -d -o ubuntu -g ubuntu /home/ubuntu/app
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
    sysctl --system || true
