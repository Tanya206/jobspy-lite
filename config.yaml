# Non-secret settings for JobSpy Lite. This file is the only place they live.
# Secrets (API keys, Telegram token, OTEL auth header) stay in .env.
# The dashboard stores overrides in SQLite; those win over this file after you save them.

ai:
  # nvidia or openai. A blank model or base_url uses that provider's preset:
  # nvidia → nvidia/nemotron-3-super-120b-a12b @ https://integrate.api.nvidia.com/v1
  #          (rewrite uses the same model)
  # openai → gpt-5-nano for scoring, gpt-5-mini for rewrite @ https://api.openai.com/v1
  provider: nvidia
  model: ""
  base_url: ""
  rate_limit_per_min: 120
  max_workers: 10
  # Reasoning models think before answering, so allow more than a few seconds.
  timeout_seconds: 60
  # gpt-5 / o-series only: minimal, low, medium, high. Blank sends none.
  # Other models ignore this and get a temperature instead.
  reasoning_effort: low
  rewrite:
    model: ""
    base_url: ""
    max_tries: 3
    timeout_seconds: 180
    reasoning_effort: medium
  checker:
    model: ""
    base_url: ""

scrape:
  sites:
    - linkedin
  search_terms:
    - AI Engineer
  location: Bengaluru
  results_wanted: 600
  hours_old: 2
  country_indeed: india
  linkedin_fetch_description: true
  is_remote: true
  scrape_cooldown_minutes: 0.2
  proxies: []

screening:
  experience_min_years: 0
  # Negative = no upper bound.
  experience_max_years: 2
  score_threshold: 70
  # 0 = keep every posting.
  retention_days: 0

pipeline:
  # 0 = never re-score on age. A new resume still re-scores everything.
  rescore_after_hours: 72

storage:
  # Relative to the project root, or an absolute path.
  data_dir: data

scheduler:
  mode: interval
  interval_minutes: 120
  active_from: 8
  active_to: 22
  cron_expression: "0 */2 * * *"
  timezone: Asia/Kolkata
  enabled: false

tracing:
  # Empty disables export. Auth stays in .env as OTEL_EXPORTER_OTLP_HEADERS.
  # Langfuse needs the /api/public/otel path, not the host alone.
  otel_endpoint: ""
  # Send prompts, model outputs, job postings, and resume text as span
  # input/output. Set false to export only timings, status, and token counts.
  capture_content: false
